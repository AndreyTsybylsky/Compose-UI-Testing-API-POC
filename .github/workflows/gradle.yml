name: KMP UI Tests CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Run Desktop JVM UI Tests
      run: ./gradlew :composeApp:desktopTest

    - name: Run iOS Simulator UI Tests
      run: ./gradlew :composeApp:iosSimulatorArm64Test

    - name: Upload Desktop JVM UI Test Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jvm-screenshots
        path: composeApp/build/screenshots/
        if-no-files-found: ignore

    - name: Upload iOS Simulator UI Test Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ios-screenshots
        path: /tmp/screenshots/
        if-no-files-found: ignore

